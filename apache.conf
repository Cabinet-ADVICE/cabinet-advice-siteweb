# Cabinet ADVICE — Apache vhost (HTTP)
#
# Install on the production server (Ubuntu + Apache 2.4):
#   sudo cp apache.conf /etc/apache2/sites-available/cabinet-advice.conf
#   sudo a2enmod rewrite headers
#   sudo a2ensite cabinet-advice
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# After HTTP works, enable HTTPS (does not touch consultlink* or consultlink-api* vhosts):
#   sudo certbot --apache -d cabinet-advice.net -d www.cabinet-advice.net
#
# DocumentRoot must match the Vite build output: npm run build → dist/

<VirtualHost *:80>
    ServerName cabinet-advice.net
    ServerAlias www.cabinet-advice.net

    DocumentRoot /var/www/cabinet-advice/dist

    <Directory /var/www/cabinet-advice/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cabinet-advice-error.log
    CustomLog ${APACHE_LOG_DIR}/cabinet-advice-access.log combined
</VirtualHost>

# Certbot will add a cabinet-advice-le-ssl.conf (or similar) VirtualHost on :443
# when you run certbot --apache. Do not overwrite consultlink / consultlink-api configs.
